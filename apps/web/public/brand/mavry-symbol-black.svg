      <rect width="128" height="128" fill="black"/>
      <circle cx="64" cy="64" r="50" fill="white"/>
      <g stroke="black" stroke-width="11" stroke-linecap="butt" stroke-linejoin="miter">
        <path d="M14 42H50L66 64"/>
        <path d="M8 64H116"/>
        <path d="M14 86H50L66 64"/>
