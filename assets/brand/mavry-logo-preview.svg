  <rect x="56" y="56" width="1168" height="284" fill="#000000"/>
  <text x="96" y="112" fill="#FDFEFFA6" font-family="Geist Variable, Geist, sans-serif" font-size="18" font-weight="500">Decision aperture on dark</text>
  <g transform="translate(104 148)" fill="#FDFDFD"><path d="M16 16H112V40H80L56 64H16V16ZM16 88H48L72 64H112V112H16V88Z"/></g>
  <text x="248" y="235" fill="#FDFDFD" font-family="Geist Variable, Geist, sans-serif" font-size="72" font-weight="650">Mavry</text>
  <g transform="translate(1032 134)" fill="#FDFDFD"><path d="M16 16H112V40H80L56 64H16V16ZM16 88H48L72 64H112V112H16V88Z"/></g>
