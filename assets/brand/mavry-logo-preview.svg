<svg width="1280" height="960" viewBox="0 0 1280 960" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Mavry decision aperture logo preview</title>
  <desc id="desc">Preview of the Mavry wordmark and compact decision aperture on dark, light, and small-format surfaces.</desc>
