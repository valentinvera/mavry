  <text x="56" y="748" fill="#16171A" font-family="Geist Variable, Geist, sans-serif" font-size="22" font-weight="650">Narrow the field. Keep the direction.</text>
  <text x="56" y="780" fill="#16171A" fill-opacity="0.64" font-family="Geist Variable, Geist, sans-serif" font-size="15" font-weight="500">Two product planes converge on one decision point, then open into a focused path.</text>
